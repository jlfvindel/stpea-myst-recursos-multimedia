# -------------------------------------------------------------
#  myst.yml · Proyecto 2, edición web completa
#  Se usa con:  myst start
# -------------------------------------------------------------
version: 1

project:
  title: 'Proyecto 2: recursos multimedia'
  authors:
    - name: José Luis Fernández Vindel
  license: CC-BY-4.0

  downloads:
    - file: descargas/recursos-multimedia.zip
      title: Fuente del proyecto (zip)

  # Macros de LaTeX disponibles en todas las páginas.
  math:
    '\vo': 'v_{0}'
    '\dd': '\,\mathrm{d}'

  toc:
    - file: index.md

    - title: Imágenes y vídeo
      children:
        - file: imagenes/imagenes.md
        - file: imagenes/videos.md

    - title: Lo que compila MyST
      children:
        - file: matematicas/ecuaciones.md
        - file: codigo/codigo.md
        - file: diagramas/diagramas.md

    - file: incrustados/iframes.md

    - file: recorrido.md             # todo junto, con vistas emergentes

site:
  template: book-theme
